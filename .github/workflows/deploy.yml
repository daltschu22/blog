name: Publish blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL }}
  CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require production settings
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          : "${SITE_URL:?Set the SITE_URL repository variable}"
          if [[ ! "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set CLOUDFLARE_WEB_ANALYTICS_TOKEN to the public 32-character beacon token."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify the /blog/ layout
        env:
          SITE_URL: https://daltschu22.github.io/blog/
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ''
        run: |
          npm run build
          npm run verify
      - name: Build and verify the custom domain
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.org/' }}
        run: |
          npm run build
          npm run verify
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
